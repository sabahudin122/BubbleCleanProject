<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="css/loginstype.css">
   <script>
        function validateLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === 'sabke' && password === '1234') {
                alert('Login successful!');
                window.location.href = 'index.html'; // U slucaju da se unese dobar user i sif ide na main
            } else {
                alert('Invalid username or password!');
                window.location.href = '#page-404'; // prebacit ce ga na 404 stranicu ako je invalid 
            }
        }
    </script>
</head>
<body>
    <div class="login-container">
        <form class="login-form" onsubmit="validateLogin(event)">
            <h2>Sign In</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p>Don't have an account? <a href="#">Sign Up</a></p>
        </form>
    </div>
</body>
</html>
